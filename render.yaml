services:
  - type: web
    name: book-pdf-reader-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://book-pdf-reader-studio.vercel.app
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
    disk:
      name: pdf-storage
      mountPath: /var/data
      sizeGB: 1
